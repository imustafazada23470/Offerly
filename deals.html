<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Salesphere - Nearby Deals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <!-- HEADER / HERO -->
  <header class="hero">
      <div class="hero-top">
    <div class="hero-center">
      <a href="index.html" class="logo">salesphere</a>

      <nav class="main-nav">
        <a href="deals.html">Deals</a>
        <a href="how-it-works.html">How it works</a>
        <a href="business.html">For businesses</a>
      </nav>
    </div>

    <div class="stats">
      <span class="stats-label">Nearby</span>
      <span class="stats-value" id="nearbyCount">0</span>
    </div>
  </div>

     <div class="hero-main hero-main--single">
    <div class="hero-search hero-search--wide">
      <label class="field-label" for="searchInput">Search places or deals</label>
      <div class="search-row">
        <input id="searchInput" class="search-input" type="text"
          placeholder="Search for cafés, restaurants, cinemas..." />
      </div>

      <div class="filters-row">
        <div class="filter-group">
          <span class="filter-label">Category</span>
          <div class="filter-buttons">
            <button class="filter-btn active" data-type="all">All</button>
            <button class="filter-btn" data-type="cafe">Cafés</button>
            <button class="filter-btn" data-type="restaurant">Restaurants</button>
            <button class="filter-btn" data-type="cinema">Cinemas</button>
            <button class="filter-btn" data-type="other">Other</button>
          </div>
        </div>

        <div class="filter-group sort-group">
          <span class="filter-label">Sort</span>
          <select id="sortSelect" class="sort-select">
            <option value="default">Recommended</option>
            <option value="discount">Highest discount</option>
            <option value="distance">Closest first</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  </header>

  <main>
    <!-- DEALS LIST -->
    <section id="deals" class="deals-section">
      <div class="section-heading">
        <h2>Nearby deals</h2>
        <p>Hand-picked discounts available around you right now.</p>
      </div>

      <div id="cardsContainer" class="cards-container">
        <!-- Cards will be injected by script.js -->
      </div>
    </section>

   

  </main>

  <!-- BOTTOM NAV (MOBILE STYLE) -->
  <footer class="bottom-nav">
    <button class="nav-btn active">Home</button>
    <button class="nav-btn">Favorites</button>
    <button class="nav-btn">Profile</button>
  </footer>

  <script src="script.js"></script>
</body>

</html>
