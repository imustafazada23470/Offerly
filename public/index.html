<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Salesphere — Deals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Salesphere helps you find real discounts nearby. Browse deals by category and sort easily."
    />
    <link rel="stylesheet" href="./main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./index.html">salesphere</a>

        <nav class="top-nav" aria-label="Primary">
          <a class="nav-link active" href="./index.html">Deals</a>
          <a class="nav-link" href="./business.html">For businesses</a>
          <a class="nav-link" href="./about.html">About</a>
        </nav>

        <div class="header-right">
          <button class="btn ghost small" id="btnEnableLocation" type="button">
            📍 Enable location
          </button>

          <div class="header-pill" aria-label="Nearby count">
            <span class="pill-label">Nearby</span>
            <span class="pill-value" id="nearbyCount">0</span>
          </div>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="page-head">
        <div class="page-head-left">
          <h1>Deals</h1>
          <p>Real discounts, all in one place.</p>
          <div class="subnote" id="locationStatus">Location not enabled.</div>
        </div>

        <div class="toolbar" aria-label="Search and sort toolbar">
          <button class="icon-btn" id="btnSearch" type="button" aria-haspopup="dialog">
            🔎 <span>Search</span>
          </button>

          <button class="icon-btn" id="btnFilter" type="button" aria-haspopup="dialog">
            ⚙️ <span>Category</span>
          </button>

          <button class="icon-btn" id="btnSort" type="button" aria-haspopup="dialog">
            ⇅ <span>Sort</span>
          </button>
        </div>
      </section>

      <section class="content">
        <div id="cardsContainer" class="cards"></div>

        <div id="emptyState" class="empty" hidden>
          <div class="empty-card">
            <div class="empty-badge">No deals yet</div>
            <h2>We’re not live with deals right now.</h2>
            <p>Once you add partner deals, they’ll appear here automatically.</p>
          </div>
        </div>
      </section>

      <!-- SEARCH MODAL -->
      <div class="modal" id="modalSearch" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-card">
          <div class="modal-top">
            <h3>Search</h3>
            <button class="xbtn" data-close="modalSearch" aria-label="Close">✕</button>
          </div>
          <label class="field">
            Search by name, description, badge
            <input id="searchInput" type="text" placeholder="e.g. coffee, student, 10%" />
          </label>
          <div class="modal-actions">
            <button class="btn primary" data-close="modalSearch" type="button">Done</button>
          </div>
        </div>
      </div>

      <!-- FILTER MODAL -->
      <div class="modal" id="modalFilter" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-card">
          <div class="modal-top">
            <h3>Category</h3>
            <button class="xbtn" data-close="modalFilter" aria-label="Close">✕</button>
          </div>

          <div class="chips" id="typeChips">
            <button class="chip active" data-type="all" type="button">All</button>
            <button class="chip" data-type="cafe" type="button">Cafés</button>
            <button class="chip" data-type="restaurant" type="button">Restaurants</button>
            <button class="chip" data-type="cinema" type="button">Cinemas</button>
            <button class="chip" data-type="other" type="button">Other</button>
          </div>

          <div class="modal-actions">
            <button class="btn primary" data-close="modalFilter" type="button">Apply</button>
          </div>
        </div>
      </div>

      <!-- SORT MODAL -->
      <div class="modal" id="modalSort" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-card">
          <div class="modal-top">
            <h3>Sort</h3>
            <button class="xbtn" data-close="modalSort" aria-label="Close">✕</button>
          </div>

          <label class="field">
            Choose sorting
            <select id="sortSelect">
              <option value="default">Recommended</option>
              <option value="discount">Highest discount</option>
              <option value="distance">Closest first</option>
            </select>
          </label>

          <div class="modal-actions">
            <button class="btn primary" data-close="modalSort" type="button">Apply</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>© <span id="year"></span> Salesphere.</span>
      </div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
    <script src="./deals.js"></script>
  </body>
</html>
